spring.application.name=jira

spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/jira}

server.port=${PORT:8080}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-only-insecure-default-secret-change-me-please-this-must-be-at-least-256-bits-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${APP_MAIL_ENABLED:true}

# File Upload Configuration
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB